[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nullmark"
version = "0.1.0"
description = "Reproducible, key-isolated experiments for open text watermarks"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "NullMark contributors"}]
dependencies = [
  "torch>=2.6,<3", "transformers==4.57.6", "pydantic>=2.10,<3", "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff==0.14.14", "build>=1,<2"]

[project.scripts]
nullmark = "nullmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nullmark"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: downloads a pinned pretrained GPT-2 model (opt-in)"]
